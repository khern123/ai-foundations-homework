[pytest]
# Tests write audit entries to a throwaway file (tests/conftest.py), never output/audit_trail.json
testpaths = tests
pythonpath = .
addopts = -p no:cacheprovider -m "not live"
markers =
    live: calls the real model through Portkey (costs API usage); run with -m live
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
